<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Consonants - Mnemonic Match</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }
        #app-container {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 700px;
            width: 100%;
            z-index: 10;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        #progress {
            font-size: 1.2rem;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 1.5rem;
        }
        #hint-box {
            font-size: 1.2rem;
            background-color: #ecf0f1;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 5px solid #3498db;
            box-sizing: border-box;
        }
        .meaning-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 0.5rem;
        }
        .hint-text {
            color: #34495e;
            font-style: italic;
        }
        #options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button.option-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem 1rem 1rem;
            border: 2px solid #bdc3c7;
            background-color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
            position: relative; 
        }
        button.option-btn:hover:not(:disabled) {
            background-color: #e8f4fd;
            border-color: #3498db;
            transform: scale(1.02);
        }
        .thai-class {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #7f8c8d;
            background-color: #f1f2f6;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }
        .thai-char {
            font-size: 4rem;
            font-family: 'Sarabun', sans-serif;
            color: #2c3e50;
            line-height: normal;
            padding: 5px 0;
        }
        .thai-name {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-top: 0.5rem;
            font-weight: bold;
        }
        button.option-btn.correct {
            background-color: #2ecc71;
            border-color: #27ae60;
        }
        button.option-btn.correct .thai-char, 
        button.option-btn.correct .thai-class,
        button.option-btn.correct .thai-name {
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
        }
        button.option-btn.correct .thai-char,
        button.option-btn.correct .thai-name {
            background-color: transparent; /* Reset background for normal text */
        }
        button.option-btn.wrong {
            background-color: #e74c3c;
            border-color: #c0392b;
        }
        button.option-btn.wrong .thai-char, 
        button.option-btn.wrong .thai-class,
        button.option-btn.wrong .thai-name {
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
        }
        button.option-btn.wrong .thai-char,
        button.option-btn.wrong .thai-name {
            background-color: transparent; 
        }
        #feedback {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
        }
        .primary-btn {
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .primary-btn:hover {
            background-color: #2980b9;
        }
        #next-btn {
            display: none;
        }

        /* --- End Screen Styles --- */
        #end-view {
            display: none;
        }
        .scoreboard {
            font-size: 2rem;
            color: #27ae60;
            margin: 1rem 0;
            font-weight: bold;
        }
        #wrong-list {
            text-align: left;
            list-style-type: none;
            padding: 0;
            margin-top: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ecf0f1;
            border-radius: 10px;
        }
        #wrong-list li {
            background: #f9fbfd;
            margin-bottom: 10px;
            padding: 15px;
            border-left: 4px solid #e74c3c;
            border-radius: 5px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* --- Extra Small Mobile Tweaks --- */
        @media (max-width: 600px) {
            body { padding: 10px; }
            #app-container { padding: 1.5rem 1rem; }
            h1 { font-size: 1.5rem; }
            #progress { font-size: 1rem; margin-bottom: 1rem; }
            #hint-box { padding: 1rem; margin-bottom: 1.5rem; min-height: 80px; }
            .meaning-text { font-size: 1.2rem; }
            .hint-text { font-size: 1rem; }
            #options { gap: 10px; }
            button.option-btn { padding: 1.5rem 0.5rem 0.5rem 0.5rem; }
            .thai-char { font-size: 3rem; }
            .thai-name { font-size: 0.95rem; }
            #feedback { font-size: 1.1rem; margin-top: 1rem; }
            #wrong-list li { font-size: 0.95rem; padding: 10px; }
            .thai-class { font-size: 0.65rem; top: 5px; right: 5px; padding: 2px 6px; }
        }
    </style>
</head>
<body>

<div id="app-container">
    
    <div id="game-view">
        <h1>Consonant Match</h1>
        <div id="progress">Score: <span id="score">0</span> / <span id="total-q">44</span></div>
        
        <div id="hint-box">
            <div class="meaning-text" id="meaning-display"></div>
            <div class="hint-text" id="hint-display"></div>
        </div>
        
        <div id="options">
            <button class="option-btn" onclick="checkAnswer(0)">
                <span class="thai-class" id="class-0"></span>
                <span class="thai-char" id="char-0"></span>
                <span class="thai-name" id="name-0"></span>
            </button>
            <button class="option-btn" onclick="checkAnswer(1)">
                <span class="thai-class" id="class-1"></span>
                <span class="thai-char" id="char-1"></span>
                <span class="thai-name" id="name-1"></span>
            </button>
            <button class="option-btn" onclick="checkAnswer(2)">
                <span class="thai-class" id="class-2"></span>
                <span class="thai-char" id="char-2"></span>
                <span class="thai-name" id="name-2"></span>
            </button>
            <button class="option-btn" onclick="checkAnswer(3)">
                <span class="thai-class" id="class-3"></span>
                <span class="thai-char" id="char-3"></span>
                <span class="thai-name" id="name-3"></span>
            </button>
        </div>

        <div id="feedback"></div>
        <button id="next-btn" class="primary-btn" onclick="loadNextQuestion()">Next Question</button>
    </div>

    <div id="end-view">
        <h1>Round Complete!</h1>
        <div class="scoreboard" id="final-score"></div>
        
        <div id="review-section" style="display:none;">
            <h3>Incorrectly Answered Questions:</h3>
            <ul id="wrong-list"></ul>
            <button id="review-btn" class="primary-btn" onclick="startReviewRound()">Review Missed Questions</button>
        </div>
        
        <div id="perfect-section" style="display:none;">
            <p style="font-size: 1.2rem; margin: 2rem 0;">Perfect! You've mastered all the consonants in this set.</p>
            <button class="primary-btn" onclick="location.reload()">Play Again from the Beginning</button>
        </div>
    </div>

</div>

<script>
    const allConsonants = [
        { char: 'ก', cls: 'MID', name: 'Gor Gài', meaning: 'Chicken', hint: 'Looks like a chicken\'s beak.' },
        { char: 'ข', cls: 'HIGH', name: 'Kŏr Kài', meaning: 'Egg', hint: 'Represents an egg, but instead, it looks like a condom! (\'Con\' sounds like \'Kŏr\', doesn’t it?)' },
        { char: 'ค', cls: 'LOW', name: 'Kor Kwaay', meaning: 'Buffalo', hint: 'Looks like a buffalo\'s butt. The buffalo loves being outside.' },
        { char: 'ง', cls: 'LOW', name: 'Ngor Nguu', meaning: 'Snake', hint: 'Looks like a snake raising its neck.' },
        { char: 'จ', cls: 'MID', name: 'Jor Jaan', meaning: 'Dish', hint: 'Looks like the hand of a waitress holding a plate.' },
        { char: 'ช', cls: 'LOW', name: 'Chor Cháang', meaning: 'Elephant', hint: 'Think of a magical elephant hatching from an egg.' },
        { char: 'ซ', cls: 'LOW', name: 'Sor Sôh', meaning: 'Chain', hint: 'A magical elephant was captured and chained.' },
        { char: 'ด', cls: 'MID', name: 'Dor Dèk', meaning: 'Kid', hint: 'Unlike a buffalo that loves being outdoors in the sun, a kid loves being in the house (look at his head tucked inside!).' },
        { char: 'ต', cls: 'MID', name: 'DTor DTào', meaning: 'Turtle', hint: 'Like a kid, a turtle with a bumpy top loves hiding its head inside its shell.' },
        { char: 'อ', cls: 'MID', name: 'or aàng', meaning: 'Sink', hint: 'The shape of this consonant looks like a sink with a faucet on top.' },
        { char: 'บ', cls: 'MID', name: 'Bor Bai-Mái', meaning: 'Leaf', hint: 'The leaf has a wider base than an egg.' },
        { char: 'ม', cls: 'LOW', name: 'Mor Máa', meaning: 'Horse', hint: 'This consonant looks like a leaf. Think of a race between a horse and a mouse; a horse is faster, so let’s draw a leg in front.' },
        { char: 'น', cls: 'LOW', name: 'Nor Nŭu', meaning: 'Mouse', hint: 'This consonant looks like a leaf. Think of a race between a horse and a mouse; a mouse is slower, so let’s draw a tail at the rear.' },
        { char: 'ป', cls: 'MID', name: 'BPor BPlaa', meaning: 'Fish', hint: 'Draw a long rear fin at the end of the leaf, turning it into a fish.' },
        { char: 'พ', cls: 'LOW', name: 'Por Paan', meaning: 'Offering Tray', hint: 'Fold the base of the leaf to turn it into an offering tray.' },
        { char: 'ย', cls: 'LOW', name: 'Yor Yák', meaning: 'Giant', hint: 'A leaf can also turn into the face of a giant. Move the head inside to make it look like a giant’s big eye, then draw a smile.' },
        { char: 'ท', cls: 'LOW', name: 'Tor Tá-Hăan', meaning: 'Soldier', hint: 'The soldier consonant looks like a soldier crawling.' },
        { char: 'ห', cls: 'HIGH', name: 'Hŏr Hèeb', meaning: 'Chest', hint: 'The chest consonant looks like a soldier carrying a chest on his back.' },
        { char: 'ว', cls: 'LOW', name: 'Wor Wăen', meaning: 'Ring', hint: 'The shape of this consonant looks like a ring on a finger.' },
        { char: 'ร', cls: 'LOW', name: 'Ror Ruuea', meaning: 'Boat', hint: 'Let’s draw a small sail above the ring, turning this into a boat.' },
        { char: 'ล', cls: 'LOW', name: 'Lor Ling', meaning: 'Monkey', hint: 'The monkey consonant looks like a monkey swinging on a vine in a tree.' },
        { char: 'ส', cls: 'HIGH', name: 'Sŏr Sŭuea', meaning: 'Tiger', hint: 'Think of a monkey being chased by a tiger. The tiger swipes its claws down on the monkey\'s head, turning the monkey consonant into a tiger consonant.' },
        { char: 'ถ', cls: 'HIGH', name: 'Tŏr Tŭng', meaning: 'Bag', hint: 'Think of the chicken consonant, then imagine fried chicken in a bag tied with a rubber band at the bottom (head inside), turning the chicken consonant into the bag consonant.' },
        { char: 'ฟ', cls: 'LOW', name: 'For Fan', meaning: 'Tooth', hint: 'Think back to childhood — some parents would tie a string to a baby tooth and yank it out.' },
        { char: 'ผ', cls: 'HIGH', name: 'Pŏr Pûeng', meaning: 'Bee', hint: 'Shaped like a tray but with the head inside; it also sounds like a tray but with a valley tone.' },
        { char: 'ฝ', cls: 'HIGH', name: 'Fŏr Făa', meaning: 'Lid', hint: 'Shaped like a tooth but with the head inside; it also sounds like a tooth but with a valley tone.' },
        { char: 'ภ', cls: 'LOW', name: 'Por Săm-Pao', meaning: 'Sailing Ship', hint: 'Shaped like a boat with a larger sail.' },
        { char: 'ฮ', cls: 'LOW', name: 'Hor Nóg-Hûug', meaning: 'Owl', hint: 'Think of an owl in a sink/tub.' },
        { char: 'ศ', cls: 'HIGH', name: 'Sŏr Săa-Laa', meaning: 'Pavillion', hint: 'Shaped like a buffalo with one line on top.' },
        { char: 'ษ', cls: 'HIGH', name: 'Sŏr Ruue-Sĕe', meaning: 'Wiseman', hint: 'Shaped like a leaf with a belt. Think of a wise man wearing clothes made of leaves.' },
        { char: 'ฉ', cls: 'HIGH', name: 'Chŏr Chìng', meaning: 'Cymbals', hint: 'Think of a mouse wearing a cymbal as a hat.' },
        { char: 'ธ', cls: 'LOW', name: 'Tor Tong', meaning: 'Flag', hint: 'Think of a flag waving in the sky.' },
        { char: 'ณ', cls: 'LOW', name: 'Nor Nen', meaning: 'Novice Monk', hint: 'Shaped like a bag and a mouse.' },
        { char: 'ญ', cls: 'LOW', name: 'Yor Yiňg', meaning: 'Lady', hint: 'Shaped like a bag and a leg wearing a shoe.' },
        { char: 'ฒ', cls: 'LOW', name: 'Tor Pûu-Tâo', meaning: 'Old Man', hint: '(Rare) Think of an old horse running slowly like a turtle. That\'s it! Turtle + Horse = Old man!' },
        { char: 'ฆ', cls: 'LOW', name: 'Kor Rá-Kang', meaning: 'Bell', hint: '(Rare) Shaped like a horse with a bump!' },
        { char: 'ฎ', cls: 'MID', name: 'Dor Chá-Daa', meaning: 'Lady Headdess', hint: '(Rare) Which consonant looks like a Chada?' },
        { char: 'ฏ', cls: 'MID', name: 'DTor BPa-DTàg', meaning: 'Spear', hint: '(Rare) Looks like a Chada with a spikier base.' },
        { char: 'ฐ', cls: 'HIGH', name: 'Tŏr Tăan', meaning: 'Base', hint: '(Rare) Which consonant has a separate base below?' },
        { char: 'ฑ', cls: 'LOW', name: 'Tor Mon-Toh', meaning: 'Mrs. Montoh', hint: '(Rare) A female soldier! So she looks like a soldier!' },
        { char: 'ฬ', cls: 'LOW', name: 'Lor Jù-Laa', meaning: 'Type of a kite', hint: '(Rare) Shaped like a tooth with a twisted tail!' },
        { char: 'ฌ', cls: 'LOW', name: 'Chor Cher', meaning: 'Tree', hint: '(Rare) A bag + horse.' },
        { char: 'ฃ', cls: 'HIGH', name: 'Kŏr Kùuad', meaning: 'Bottle', hint: '(Obsolete) Shaped like an egg with a bump!' },
        { char: 'ฅ', cls: 'LOW', name: 'Kor Kon', meaning: 'Human', hint: '(Obsolete) Shaped like a buffalo with a bump!' }
    ];

    let score = 0;
    let totalQuestionsThisRound = 0;
    let gameQueue = [];
    let wrongHistory = [];
    let currentQuestion = null;
    let currentOptions = [];
    let correctIndex = -1;

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function initGame() {
        const standard = [];
        const rare = [];
        const obsolete = [];

        allConsonants.forEach(c => {
            if (c.hint.includes('(Obsolete)')) {
                obsolete.push(c);
            } else if (c.hint.includes('(Rare)')) {
                rare.push(c);
            } else {
                standard.push(c);
            }
        });

        gameQueue = [
            ...shuffleArray(standard),
            ...shuffleArray(rare),
            ...shuffleArray(obsolete)
        ];

        startRound(gameQueue.length);
    }

    function startRound(questionCount) {
        score = 0;
        totalQuestionsThisRound = questionCount;
        wrongHistory = [];
        
        document.getElementById('score').innerText = score;
        document.getElementById('total-q').innerText = totalQuestionsThisRound;
        
        document.getElementById('end-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';

        loadNextQuestion();
    }

    function loadNextQuestion() {
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').style.display = 'none';
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => {
            btn.classList.remove('correct', 'wrong');
            btn.disabled = false;
        });

        if (gameQueue.length === 0) {
            showEndScreen();
            return;
        }

        currentQuestion = gameQueue.shift();
        
        let distractors = allConsonants.filter(c => c.char !== currentQuestion.char);
        distractors = shuffleArray(distractors).slice(0, 3);
        
        currentOptions = shuffleArray([currentQuestion, ...distractors]);
        correctIndex = currentOptions.findIndex(c => c.char === currentQuestion.char);

        document.getElementById('meaning-display').innerText = `Find: "${currentQuestion.meaning}"`;
        document.getElementById('hint-display').innerText = `Hint: ${currentQuestion.hint}`;
        
        currentOptions.forEach((opt, index) => {
            document.getElementById(`char-${index}`).innerText = opt.char;
            document.getElementById(`class-${index}`).innerText = opt.cls;
            document.getElementById(`name-${index}`).innerText = opt.name;
        });
    }

    function checkAnswer(selectedIndex) {
        const buttons = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');
        
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctIndex) {
            score++;
            document.getElementById('score').innerText = score;
            buttons[selectedIndex].classList.add('correct');
            feedback.innerText = "Correct! Great job."; 
            feedback.style.color = "#27ae60";
        } else {
            wrongHistory.push({
                question: currentQuestion,
                selected: currentOptions[selectedIndex]
            });

            buttons[selectedIndex].classList.add('wrong');
            buttons[correctIndex].classList.add('correct');
            
            const correctAnswer = currentOptions[correctIndex];
            feedback.innerText = `Incorrect. The correct answer is ${correctAnswer.char} (${correctAnswer.name}).`;
            feedback.style.color = "#c0392b";
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function showEndScreen() {
        document.getElementById('game-view').style.display = 'none';
        document.getElementById('end-view').style.display = 'block';
        
        document.getElementById('final-score').innerText = `${score} / ${totalQuestionsThisRound}`;
        
        const listContainer = document.getElementById('wrong-list');
        listContainer.innerHTML = ''; 

        if (wrongHistory.length > 0) {
            document.getElementById('review-section').style.display = 'block';
            document.getElementById('perfect-section').style.display = 'none';

            wrongHistory.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <strong>Find: ${item.question.meaning}</strong> <br>
                    <span style="font-size:0.9em; color:#7f8c8d;">Hint: ${item.question.hint}</span><br>
                    ❌ You chose: ${item.selected.char} (${item.selected.name})<br>
                    ✅ Correct: <span style="color:#27ae60; font-weight:bold;">${item.question.char} (${item.question.name})</span>
                `;
                listContainer.appendChild(li);
            });
        } else {
            document.getElementById('review-section').style.display = 'none';
            document.getElementById('perfect-section').style.display = 'block';
        }
    }

    function startReviewRound() {
        gameQueue = shuffleArray(wrongHistory.map(item => item.question));
        startRound(gameQueue.length);
    }

    initGame();
</script>

</body>
</html>
